; ─────────────────────────────────────────────────────────────────────────────
; RNS gateway role on the T-Beam Supreme (appended block — the fork's parity
; rule allows exactly this: one appended block per board variant file).
; Board specifics only; everything else is [rns_gateway_role] in
; variants/rns_gateway/platformio.ini. Compared with the Heltec V4:
;   - 8 MB PSRAM, so the PSRAM allocator flags apply unchanged with room.
;   - SH1106 OLED at 0x3D (the board base defines DISPLAY_CLASS and pins;
;     StatusScreen draws through MeshCore's DisplayDriver, so it is unchanged).
;   - No LoRa front-end module: tx_power is the SX1262's own, 22 dBm max.
;   - GPS stays enabled (the board base's ENV_INCLUDE_GPS=1) — it is a time
;     source, which a device with no WiFi otherwise lacks.
;   - PRG is GPIO0 here too, so the hold gestures carry over.
; ─────────────────────────────────────────────────────────────────────────────
[tbeam_supreme_rns_gateway_base]
extends = T_Beam_S3_Supreme_SX1262
extra_scripts = ${rns_gateway_role.extra_scripts}
build_flags =
  ${T_Beam_S3_Supreme_SX1262.build_flags}
  ; boards/t_beams3_supreme.json declares 8 MB QSPI PSRAM (memory_type
  ; qio_qspi) but, unlike heltec_v4.json, does not set BOARD_HAS_PSRAM —
  ; MeshCore's own roles never allocate from it. microReticulum's PSRAM
  ; pool allocator refuses to compile without the flag, and the Arduino
  ; core only initialises PSRAM when it is set. The boot [mem] line shows
  ; whether it actually came up.
  -D BOARD_HAS_PSRAM
  ${rns_gateway_role.build_flags}
build_src_filter = ${T_Beam_S3_Supreme_SX1262.build_src_filter}
  ${rns_gateway_role.build_src_filter}
lib_deps =
  ${T_Beam_S3_Supreme_SX1262.lib_deps}
  ${rns_gateway_role.lib_deps}

; Release variants — same three as the Heltec V4 (see its ini for what each
; means). No secrets; Stationary and Mobile WiFi boot AP-first for portal
; configuration, Mobile BLE boots into the setup session until it has a PSK.
[env:tbeam_supreme_rns_gateway_stationary]
extends = tbeam_supreme_rns_gateway_base
build_flags =
  ${tbeam_supreme_rns_gateway_base.build_flags}
  -D ADVERT_NAME='"RNS GW Stationary"'
  -D RNS_GW_VARIANT_NAME='"STATIONARY"'
  -D WIFI_AP_SSID='"RNSGateway-Stationary"'
  -D WIFI_AP_PWD='"rnsgateway"'
  -D MDNS_HOSTNAME='"rnsgateway-stationary"'

[env:tbeam_supreme_rns_gateway_mobile_wifi]
extends = tbeam_supreme_rns_gateway_base
build_flags =
  ${tbeam_supreme_rns_gateway_base.build_flags}
  -D ADVERT_NAME='"RNS GW Mobile"'
  -D RNS_GW_VARIANT_NAME='"MOBILE"'
  -D WIFI_AP_SSID='"RNSGateway-Mobile"'
  -D WIFI_AP_PWD='"rnsgateway"'
  -D MDNS_HOSTNAME='"rnsgateway-mobile"'

[env:tbeam_supreme_rns_gateway_mobile_ble]
extends = tbeam_supreme_rns_gateway_base
build_flags =
  ${tbeam_supreme_rns_gateway_base.build_flags}
  -D ADVERT_NAME='"RNS GW BLE"'
  -D RNS_GW_VARIANT_NAME='"BLE"'
  -D WIFI_AP_SSID='"RNSGateway-BLE"'
  -D WIFI_AP_PWD='"rnsgateway"'
  -D MDNS_HOSTNAME='"rnsgateway-ble"'
  -D RNS_GW_CLIENT_ACCESS=1
