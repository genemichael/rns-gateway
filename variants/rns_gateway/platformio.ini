; ─────────────────────────────────────────────────────────────────────────────
; RNS gateway role — the board-INDEPENDENT half of every gateway env.
;
; Picked up by the root `extra_configs = variants/*/platformio.ini` glob like
; any variant file, but it defines no board and no env: it is a section that
; each board's appended block pulls in. The board halves live where MeshCore
; keeps boards — an appended block in variants/<board>/platformio.ini — so
; adding a board is one block there plus one line in scripts/check_parity.sh.
;
; A brand-new file, so it costs nothing at rebase time (see the parity rule
; in scripts/check_parity.sh).
; ─────────────────────────────────────────────────────────────────────────────
[rns_gateway_role]
; merge-bin.py comes from esp32_base; patch_msgpack.py exposes the MsgPack
; internals microLXMF's fields map needs; patch_spiffs_paths.py normalises
; microStore's relative paths (see memory: transport identity persistence).
extra_scripts =
  merge-bin.py
  pre:patch_msgpack.py
  pre:patch_spiffs_paths.py
build_flags =
  ; NOTE ON FORMAT CHECKING: a bad %s in a log line is not cosmetic — it
  ; dereferences whatever integer sat in that argument slot and panics the
  ; node. It cost one crash-looping board here. The compiler CAN catch it:
  ; slog() carries __attribute__((format(printf,...))) in SerialLog.h, which is
  ; what makes the call sites checkable at all.
  ; But it cannot be enforced in this env. The repo-wide -w suppresses all
  ; warnings and wins over any later -W flag, and unflagging -w to re-enable
  ; -Werror=format makes the build fail inside upstream MeshCore
  ; (src/helpers/StatsFormatHelper.h has its own %u/long mismatch) — which we
  ; are not allowed to edit. Verified both ways.
  ; So: keep the attribute, and build once with `-w` unflagged by hand when
  ; touching log lines. Revisit if that upstream warning is ever fixed.
  ; ---- LoRa: US regional MeshCore parameters --------------------------
  ; These must match the target mesh EXACTLY. Wrong values are a silent
  ; failure, not an error — nothing complains, you simply never hear the
  ; mesh. MyMesh::begin() prints the ACTIVE values at boot; trust that
  ; line over this file, because a /prefs.json left behind by earlier
  ; firmware survives a reflash (it lives in SPIFFS, not the app
  ; partition) and correctly wins over these build defaults.
  ; Equivalent CLI, note the commas: set radio 910.525,62.5,7,5
  ;
  ; These deliberately RE-define the EU defaults inherited from
  ; platformio.ini (869.618 / 62.5 / SF8) rather than build_unflags'ing
  ; them. build_unflags is applied to the merged flag list and matches on
  ; the literal string, so unflagging '-D LORA_BW=62.5' would strip our
  ; own identical flag too and leave LORA_BW undefined. Last -D wins.
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  ; LORA_CR is #defined inside each variant's target.cpp behind an #ifndef,
  ; so it is NOT visible to MyMesh.cpp — which reads it to seed NodePrefs.
  ; It has to be a build flag here or the role does not compile.
  -D LORA_CR=5
  ; Channel messaging is the bridge surface — BaseChatMesh only compiles the
  ; channel table when MAX_GROUP_CHANNELS is defined.
  -D MAX_GROUP_CHANNELS=8
  -D MAX_CONTACTS=100
  -D ADVERT_NAME='"RNS Gateway"'
  -D ADMIN_PASSWORD='"password"'
  ; ADMIN_PASSWORD pulls in ESP32Board's softAP OTA web server. This node
  ; raises its OWN softAP for client access (see WIFI_AP_SSID in main.cpp),
  ; and must not stand up a second, competing one.
  -D DISABLE_WIFI_OTA
  ; WiFi credentials, the bridge channel PSK and the RNS peer live in
  ; platformio.local.ini (gitignored) — never in a tracked file.
  ;
  ; ---- embedded Reticulum ---------------------------------------------
  ; Allocator config mirrors Pyxis: RNS containers come out of an explicit
  ; PSRAM pool so they cannot fragment the internal heap the radio and
  ; WiFi/BLE stacks share. 1 MiB — the V4.3 has 2 MB, the T-Beam Supreme 8.
  ; A board WITHOUT PSRAM must not use this section as-is.
  -D RNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
  -D RNS_CONTAINER_ALLOCATOR=RNS_PSRAM_POOL_ALLOCATOR
  -D RNS_PSRAM_POOL_BUFFER_SIZE=1048576
  ; microStore's SPIFFS adapter, shared with MeshCore's own SPIFFS mount.
  ; Required regardless of RNS_USE_FS: Reticulum::start() calls
  ; OS::storage_size() unconditionally, which throws without a registered
  ; filesystem and terminates the RNS task.
  -D USTORE_USE_SPIFFS
  ; RNS_USE_FS gates the BODY of Identity::to_file/from_file — without it they
  ; compile down to `return false`, so the transport identity can never be
  ; written and the node comes up as a brand-new RNS node on every boot, with
  ; no error logged anywhere. Verified on hardware: the identity changed on
  ; every reboot until this was set.
  ; SPIFFS is a FLAT filesystem — mkdir always fails — but '/' is legal inside
  ; a filename, so microReticulum's "/cache/<hash>" paths still resolve.
  -D RNS_USE_FS
  ; RNS_PERSIST_PATHS is DELIBERATELY OFF. It was tried on 2026-08-20/21 to
  ; stop reboots from wiping learned paths, and microStore's FileStore proved
  ; unstable on SPIFFS: the first real path write tripped compaction, the node
  ; panicked (LoadProhibited) seconds later, and the next 17 boots crashed
  ; while loading the compacted store. Boot-time store init also panicked
  ; roughly once per cold boot even before any data was written. The cure was
  ; strictly worse than the disease — the reboots that wipe paths were being
  ; CAUSED by the path store. Without it, paths live in RAM, are reseeded by
  ; announces (10-min/destination throttle) after a reboot, and the node is
  ; stable for hours.
  ; TODO(upstream): FileStore compaction on SPIFFS in torlando-tech/microStore
  ; — reproduce with a put() that crosses the deleted threshold; see the
  ; 2026-08-21 G2 serial capture. Re-enable only after that is fixed. A board
  ; with an SD card (T-Beam Supreme) is the natural place to revisit it.
  ;-D RNS_PERSIST_PATHS
  -I lib/microreticulum-shim
  -I lib/libbz2
  -D BZ_NO_STDIO
; Role sources and the button driver every board's gestures need.
build_src_filter =
  +<../examples/rns_gateway/>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ; BaseChatMesh::addChannel decodes the channel PSK via <base64.hpp>
  densaugeo/base64 @ ~1.4.0
  ; Config portal. All three ship with the ESP32 Arduino framework — no
  ; third-party dependency — but PlatformIO's LDF still needs them named
  ; explicitly, exactly like SPI and Wire.
  WebServer
  DNSServer
  ESPmDNS
  ; BLE client access (BleInterface.h) — the framework's own Bluedroid
  ; wrapper, same library upstream's SerialBLEInterface uses. No new
  ; third-party dependency. Registered under this name, not "BLE".
  ESP32 BLE Arduino
  ; Pinned to the same commits Pyxis ships — see reference/pyxis/platformio.ini
  ; for why each pin was taken. microStore MUST be listed before microReticulum:
  ; microReticulum declares an unconstrained registry dependency on it, and
  ; whichever resolves first wins.
  https://github.com/torlando-tech/microStore.git#2762f7606800ffb23f4a593947d4f58e259cda7a
  https://github.com/torlando-tech/microReticulum.git#cd0338e7fc07d3a7785a450656ba766491cbf6e8
  https://github.com/torlando-tech/microLXMF.git#60fb7d6951bd17275da83fdd9581900d55b0a2ab
  bblanchon/ArduinoJson @ ^7.4.2
  hideakitai/MsgPack @ ^0.4.2
